# Typography preview for ambient-display. This is a bench, not a public
# service -- it is restricted to the LAN.
#
#   sudo cp deploy/nginx-ambient-display.conf /etc/nginx/sites-available/ambient-display
#   sudo ln -s /etc/nginx/sites-available/ambient-display /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name bloopy.lan bloopy;

    access_log /var/log/nginx/ambient-display.access.log;
    error_log  /var/log/nginx/ambient-display.error.log;

    allow 192.168.221.0/24;
    allow 127.0.0.1;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8324;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Frames are regenerated constantly; never let anything cache them.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }
}
