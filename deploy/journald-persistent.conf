# Keep the journal across reboots. Install as
#   /etc/systemd/journald.conf.d/99-persistent-storage.conf
#
# Raspberry Pi OS ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
# with Storage=volatile, pinning the journal to /run -- tmpfs, capped ~8 M, and it
# rotated three times in the four hours after boot on pixelpup. /var/log/journal
# existing does NOT override that: the directory only enables persistence under
# Storage=auto, so it sat there empty since June looking like the feature was on.
#
# 99- sorts after 40-, so this wins. Same file and same values as jungler.
#
# Verify on the box, never from the repo: `journalctl --list-boots` must show
# more than one. Everything else only proves the config was read.
[Journal]
Storage=persistent
SystemMaxUse=512M
SystemKeepFree=2G
SystemMaxFileSize=64M
RuntimeMaxUse=16M
